name: Build

on:
  push:
    branches:
      - main
      # rn-media's working branch. The build has to be verifiable BEFORE it is
      # merged or tagged; the release step below is still gated on main, so a
      # run from here produces artifacts and nothing else.
      - rn-media-hls
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The mpv patches are plain C in mpv's core, so they are testable without a
  # device. This job builds a NATIVE libmpv from the same patched sources the
  # Android job builds, and asserts patch 006's behaviour through the public
  # client API. Runs in parallel with the Android build.
  #
  # ubuntu-24.04 and not 22.04: mpv 0.41 needs libplacebo >= 6.338 (jammy has
  # 4.192) and libavcodec >= 60.31.102. noble carries both.
  test:
    name: Host regression tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          # mpv 0.41's mandatory set, verbatim from its meson.build lines
          # 21-30: the six ffmpeg libraries plus libplacebo. libass is not one
          # of ours — patch 003 removes it.
          sudo apt-get install -y ninja-build pkg-config \
            libavcodec-dev libavfilter-dev libavformat-dev libavutil-dev \
            libswresample-dev libswscale-dev libplacebo-dev
          pipx install meson
          meson --version
          pkg-config --modversion libavcodec libavfilter libavformat \
            libavutil libswresample libswscale libplacebo
      - name: Run host regression tests
        run: ./buildscripts/tests/run.sh

  build:
    name: Build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      # mpv is meson-only since 0.37 and libplacebo has always been meson, so
      # this repo stopped building with the runner image's stock toolchain at
      # the 0.41 bump. mpv 0.41's meson.build says meson_version: '>=1.3.0';
      # ubuntu-22.04's apt meson is 0.61.2, hence pipx rather than apt for that
      # one. nasm is ffmpeg's x86/x86_64 assembler.
      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build nasm pkg-config
          pipx install meson
          meson --version && ninja --version && nasm -v
      # The NDK is pinned in depinfo.sh and hardcoded into bundle.sh's strip
      # path; the runner image only happens to carry some NDK. Read the pin
      # rather than trusting the image, and install it if it is missing.
      - name: Install pinned NDK
        run: |
          v_ndk=$(sed -n 's/^v_ndk=//p' buildscripts/include/depinfo.sh)
          echo "pinned NDK: $v_ndk"
          if [ ! -d "$ANDROID_HOME/ndk/$v_ndk" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$v_ndk"
          fi
          ls "$ANDROID_HOME/ndk/$v_ndk/toolchains/llvm/prebuilt"
      - name: Symlink SDK
        working-directory: ./buildscripts
        run: |
          mkdir sdk
          ln -s ${ANDROID_HOME} ./sdk/android-sdk-linux
      - name: Bundle
        working-directory: ./buildscripts
        run: |
          ./bundle.sh
      # An independent, workflow-level check that the engine actually built.
      #
      # bundle.sh asserts the same thing, and this deliberately duplicates it:
      # the failure being guarded against is a build script that silently stops
      # producing libmpv.so, and a guard that lives only inside that same script
      # is one edit away from going with it. This one also catches the shape the
      # artifact SIZE would have shown -- four green runs uploaded 480 KB of
      # helper library where a real build uploads ~15 MB, and nothing looked.
      - name: Assert the engine is actually in the jars
        run: |
          cd buildscripts/deps/media-kit-android-helper/app/build/outputs/apk/release
          total=0
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            jar="default-$abi.jar"
            if [ ! -f "$jar" ]; then
              echo "::error::$jar was not produced"; exit 1
            fi
            if ! unzip -l "$jar" | grep -q "lib/$abi/libmpv.so"; then
              echo "::error::$jar contains no lib/$abi/libmpv.so -- the engine did not build"
              unzip -l "$jar"; exit 1
            fi
            size=$(stat -c%s "$jar")
            total=$((total + size))
            echo "$jar: $size bytes"
            # A real stripped libmpv.so compresses to ~3.5-4 MB per ABI. The
            # empty-jar failure mode produced ~120 KB, so 2 MB separates them
            # with a wide margin either way.
            if [ "$size" -lt 2000000 ]; then
              echo "::error::$jar is only $size bytes; a real build is >2 MB"; exit 1
            fi
          done
          echo "All four jars carry libmpv.so; total $total bytes."

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact
          path: |
            ./buildscripts/*.jar
            ./buildscripts/deps/media-kit-android-helper/app/build/outputs/apk/release/*.jar
      - name: Upload Release
        uses: softprops/action-gh-release@v1
        if: github.ref == 'refs/heads/main'
        with:
          draft: true
          prerelease: false
          tag_name: "vnext"
          files: |
            buildscripts/*.zip
            buildscripts/deps/media-kit-android-helper/app/build/outputs/apk/release/*.jar
